async function sb(path,opts={}){const headers={apikey:SUPABASE_KEY,"Content-Type":"application/json",...(opts.headers||{})};if(SUPABASE_KEY.startsWith("eyJ"))headers.Authorization="Bearer "+SUPABASE_KEY;let res;try{res=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+path,{cache:"no-store",...opts,headers})}catch{throw Error("Нет связи с сервером")}if(!res.ok){let t="";try{t=(await res.json()).message||""}catch{}throw Error(res.status===401||res.status===403?"нет доступа к базе (проверьте ключ и SQL-настройки)":res.status===404?"таблица draft_state не найдена (запустите SQL из инструкции)":"ошибка сервера "+res.status+(t?": "+t:""))}return res.json()}
async function commit(mutator){for(let attempt=0;attempt<6;attempt++){const rows=await sb("draft_state?id=eq.1&select=version,data");if(!rows.length)throw Error("Строка драфта не найдена в базе (запустите SQL из инструкции)");const cur=rows[0],s=normalize(cur.data);mutator(s);const out=await sb("draft_state?id=eq.1&version=eq."+cur.version,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({data:clean(s),version:cur.version+1})});if(out.length){applyRemote(out[0]);return}}throw Error("Не удалось записать: слишком много одновременных изменений. Повторите.")}

function bannerHtml(){let t="";if(configError)t="База данных не настроена: впишите настройки Supabase в начале кода.";else if(loadError)t="Ошибка базы данных: "+loadError;else if(!ready)t="Подключаемся к общей базе…";else if(!online)t="Нет связи с сервером. Пока связи нет, выборы не сохраняются.";return t?`<div class="offline-banner">${esc(t)}</div>`:""}
function isTyping(){const a=document.activeElement;return !!a&&root.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}

function download(name,content,type){const blob=new Blob([content],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function csvCell(value){return `"${String(value??"").replaceAll('"','""')}"`}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return[];const sep=lines[0].includes("\t")?"\t":lines[0].includes(";")?";":",";function split(line){let quoted=false,cur="",out=[];for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'&&quoted){cur+='"';i++}else if(ch==='"')quoted=!quoted;else if(ch===sep&&!quoted){out.push(cur.trim());cur=""}else cur+=ch}out.push(cur.trim());return out}let data=lines.map(split);if(/^(name|имя|игрок)$/i.test(data[0]?.[0]||""))data=data.slice(1);return data.map(([name,version,rating,position])=>({name,version,rating:Number(rating),position}))}
async function click(event){const el=event.target.closest("[data-action]");if(!el||el.disabled)return;const action=el.dataset.action;try{

if(action==="pick"){if(!isMyTurn())throw Error("Сейчас ход другого участника");const c=card(Number(el.dataset.id)),me=person(session.id);if(!c||!me)throw Error("Карточка не найдена");if(state.picks.some(p=>card(p.cardId)?.name.trim().toLowerCase()===c.name.trim().toLowerCase()))throw Error("Этот футболист уже выбран в другой версии карточки");const problem=canTake(me.rank,owned(me.id),c);if(problem)throw Error(problem);if(!confirm(`Выбрать ${c.name} (${c.version}, ${c.rating})?`))return;const expected=state.picks.length,cid=c.id,pid=me.id,lname=c.name.trim().toLowerCase();await commit(s=>{if(s.status!=="live")throw Error("Драфт сейчас не идёт");if(s.picks.length!==expected)throw Error("Ход уже изменился: кто-то успел раньше. Обновите выбор и повторите");if(nextId(s.picks.length)!==pid)throw Error("Сейчас ход другого участника");if(s.picks.some(p=>p.cardId===cid||card(p.cardId)?.name.trim().toLowerCase()===lname))throw Error("Этот футболист уже выбран");s.picks.push({number:s.picks.length+1,pid,cardId:cid,at:new Date().toISOString()})});query="";render();return}
if(session.role!=="admin")throw Error("Доступ только организатору");
if(action==="save-people"){if(state.status==="live"||state.picks.length)throw Error("Остановите и сбросьте драфт перед заменой участников");const people=[...document.querySelectorAll(".person-row")].map((row,i)=>({id:i+1,name:row.querySelector(".person-name").value.trim(),rank:Number(row.querySelector(".person-rank").value)}));if(people.length!==PEOPLE||people.some(p=>!p.name||p.name.length>80||!Number.isInteger(p.rank)||p.rank<1||p.rank>24)||new Set(people.map(p=>p.rank)).size!==PEOPLE)throw Error("Нужны 24 имени и уникальные ранги 1–24");issuedCodes=await Promise.all(people.map(async p=>{const code=randomCode();p.codeHash=await sha(code);return{id:p.id,name:p.name,rank:p.rank,code}}));state.participants=people;await save();warn("Участники сохранены. Скачайте новые личные коды — позже они не будут показаны.");return}
if(action==="download-codes"){if(!issuedCodes.length)throw Error("Сначала сохраните участников");download("piala-invite-codes.csv","\uFEFF"+["Порядок;Имя;Ранг;Код",...issuedCodes.map(p=>[p.id,p.name,p.rank,p.code].map(csvCell).join(";"))].join("\n"),"text/csv;charset=utf-8");return}
if(action==="upload"){if(state.picks.length)throw Error("После первого пика менять пул нельзя");const rows=parseCSV(document.getElementById("card-csv").value);if(!rows.length)throw Error("Вставьте строки карточек");if(rows.some(c=>!c.name||!c.version||!c.position||!Number.isInteger(c.rating)||c.rating<72||c.rating>99||!(/^[\x20-\x7e]+$/).test(c.name)))throw Error("Проверьте имя латиницей, версию, позицию и рейтинг 72–99");const identities=new Map(cards.map(c=>[c.name+"\0"+c.version,c]));for(const row of rows){const old=identities.get(row.name+"\0"+row.version);if(old){if(old.id<=pool.length)state.overrides[old.id]={rating:row.rating,position:row.position};else Object.assign(state.extras[old.id-pool.length-1],{rating:row.rating,position:row.position})}else{const extra={id:pool.length+state.extras.length+1,...row};state.extras.push(extra);identities.set(row.name+"\0"+row.version,extra)}}updateCards();await save();warn(`Обработано карточек: ${rows.length}`);return}
if(action==="start"){if(state.participants.length!==PEOPLE)throw Error("Сначала настройте 24 участников");if(cards.length<TOTAL)throw Error("Нужно не меньше 432 карточек");const low=cards.filter(c=>c.rating>=72&&c.rating<=74).length,mid=cards.filter(c=>c.rating>=75&&c.rating<=78).length;if(low<24||mid<52)throw Error("Для квот нужны минимум 24 карточки 72–74 и 52 карточки 75–78");await commit(s=>{s.status="live"});render();return}

async function submit(event){const form=event.target.closest("form[data-form]");if(!form)return;event.preventDefault();const value=form.elements.code.value.trim().toUpperCase();try{if(!ready)throw Error("Подключаемся к базе… подождите пару секунд и повторите");const hash=await sha(value);if(form.dataset.form==="admin-login"){if(hash!==ADMIN_HASH)throw Error("Неверный код организатора");session={role:"admin",id:0,hash};tab="admin";saveSession(hash)}else if(hash===ADMIN_HASH){session={role:"admin",id:0,hash};tab="admin";saveSession(hash)}else{const p=state.participants.find(p=>p.codeHash===hash);if(!p)throw Error("Код не найден");session={role:"participant",id:p.id,hash};tab="live";saveSession(hash)}notice="";render()}catch(error){warn(error.message||"Ошибка входа")}}
async function restore(file){if(session.role!=="admin")return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.participants)||!Array.isArray(data.picks)||!Array.isArray(data.extras)||data.picks.length>TOTAL||data.participants.length>PEOPLE)throw Error("Неверный формат копии");if(!confirm("Заменить текущие данные содержимым резервной копии?"))return;state={...defaultState(),...data};issuedCodes=[];updateCards();await save();warn("Резервная копия восстановлена") }catch(error){warn(error.message||"Не удалось восстановить копию")}}
root.addEventListener("click",click);root.addEventListener("submit",submit);root.addEventListener("input",event=>{if(event.target.id==="card-search"){query=event.target.value;results()}});root.addEventListener("change",event=>{if(event.target.id==="restore-file"&&event.target.files?.[0])restore(event.target.files[0]);if(event.target.id==="rating-min"){minRating=event.target.value;if(maxRating&&Number(minRating)>Number(maxRating)){maxRating="";document.getElementById("rating-max").value=""}results()}if(event.target.id==="rating-max"){maxRating=event.target.value;if(minRating&&Number(maxRating)<Number(minRating)){minRating="";document.getElementById("rating-min").value=""}results()}if(event.target.id==="position-filter"){positionFilter=event.target.value;results()}});root.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender&&!isTyping())refresh()},700)});
(async()=>{try{const text=document.getElementById("card-pool").textContent.trim(),bytes=Uint8Array.from(atob(text),ch=>ch.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")),rows=JSON.parse(await new Response(stream).text());pool=rows.map(([name,version,rating,position],i)=>({id:i+1,name,version,rating,position}));state=defaultState();updateCards();render();startSync()}catch(error){root.innerHTML=`<main class="site"><div class="empty">Не удалось загрузить автономный пул карточек: ${esc(error.message)}. Откройте файл в современном браузере.</div></main>`}})();
})();
