:root{color-scheme:dark;--bg:#14090A;--panel:#1D0F11;--line:#4A252A;--ink:#F3E3C3;--muted:#B8A78C;--gold:#D9A23F;--teal:#E5122B}
*{border-radius:0!important}
body{background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.site{background:var(--bg)}
.brand b,.headline h1,.hero-name,.hero-right strong,.roster-header h2,.next-name,.quota-mini strong,.unlimited-rule strong,.card-rating{font-family:"Rubik Mono One",Inter,Arial,sans-serif!important;font-weight:400!important;text-transform:uppercase;letter-spacing:0!important}
.headline h1{font-size:clamp(24px,3vw,42px)}.hero-name{font-size:clamp(22px,2.6vw,36px);overflow-wrap:anywhere}.hero-right strong{font-size:46px}.roster-header h2{font-size:24px}.next-name{font-size:18px}.brand b{font-size:15px}.card-rating{font-size:16px}.quota-mini strong,.unlimited-rule strong{font-size:16px}
.login button,.primary{background:#A3000F;border-color:#E5122B;color:#FBF7EE;text-transform:uppercase;letter-spacing:.06em}
.login button:hover,.primary:hover{background:#B8101C;filter:none}
.card-result button{background:#A3000F;border-color:#E5122B;color:#FBF7EE}
.pill{color:#D9A23F;border-color:#D9A23F;background:#2B1013}
.live-dot{background:#E5122B}
@media(max-width:700px){.headline h1{font-size:22px}.hero-name{font-size:20px}.hero-right strong{font-size:32px}.roster-header h2{font-size:20px}}
.autotimer{border:2px solid #cf9530;color:#f3d39a;padding:4px 9px;font-weight:700;letter-spacing:.12em;font-size:11px;font-variant-numeric:tabular-nums}.autotimer.off{border-color:#6f343a;color:#b09c89}.autotimer.late{border-color:#E5122B;color:#fff;background:#7a1820}
.card-result .btns{display:flex;gap:6px;flex:0 0 auto}.card-result button.wish{background:transparent;border-color:#7a5a3a;color:#deb56f;padding:9px 10px;font-size:14px}.card-result button.wish.on{background:#4a3416;border-color:#deb56f}
.wish-panel{margin-top:20px}.wish-list{padding:3px 23px 13px;counter-reset:w}.wish-row{display:flex;align-items:center;gap:10px;border-bottom:2px solid #51262a;padding:10px 0;font-size:12px}.wish-row:last-child{border-bottom:0}.wish-row .wn{color:#b09c89;width:22px;font-variant-numeric:tabular-nums}.wish-row .wi{flex:1;min-width:0}.wish-row .wi strong{display:block;font-size:13px}.wish-row .wi small{display:block;color:#b4a489;font-size:10px;margin-top:3px}.wish-row b{font-size:15px}.wish-row.off .wi strong,.wish-row.off b{opacity:.45;text-decoration:line-through}.wish-row.next{background:#3a2a12;box-shadow:inset 3px 0 0 #deb56f;padding-left:8px}.wish-row button{background:transparent;border:2px solid #6f343a;color:#e9dccb;padding:5px 8px;font-size:11px}.wish-row button:disabled{opacity:.3}
.auto-tag{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.14em;border:1px solid #cf9530;color:#f3d39a;padding:2px 5px;margin-left:6px;vertical-align:middle}
.auto-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 23px}.auto-row input{width:90px;background:#1d0d0f;color:#faf1f2;border:2px solid #5a2a2f;padding:9px 10px}
.org-wish{padding:0 23px 16px}.org-wish details{border-bottom:2px solid #51262a}.org-wish summary{cursor:pointer;padding:11px 0;display:flex;gap:10px;align-items:center;font-size:12px;list-style:none}.org-wish summary::-webkit-details-marker{display:none}.org-wish summary b{flex:1}.org-wish summary span{color:#b09c89}.org-wish summary .on{color:#f3d39a}.org-wish .wish-list{padding:0 0 10px}
.rnd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 23px}.rnd-grid label{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:.12em;color:#beb19a;font-weight:600}.rnd-grid select{background:#1d0d0f;color:#faf1f2;border:2px solid #5a2a2f;padding:9px 10px}
.rnd-card{display:flex;gap:16px;align-items:center;border:2px solid #cf9530;background:#3a2a12;padding:14px 16px;margin:12px 23px}.rnd-card .r{font-size:34px;font-weight:700}.rnd-card strong{display:block;font-size:16px}.rnd-card small{color:#d8c7a8}
@media(max-width:700px){.rnd-grid{grid-template-columns:1fr}}
.rp-list{padding:0 23px 10px}.rp-row{display:flex;align-items:center;gap:10px;border-bottom:2px solid #51262a;padding:9px 0;font-size:12px}.rp-row .n{color:#b09c89;width:34px;font-variant-numeric:tabular-nums}.rp-row .i{flex:1;min-width:0}.rp-row .i strong{display:block;font-size:13px}.rp-row .i small{color:#b4a489;font-size:10px}.rp-row b{font-size:15px}.rp-row.sel{background:#3a2a12;box-shadow:inset 3px 0 0 #deb56f;padding-left:8px}.rp-row button{background:transparent;border:2px solid #6f343a;color:#e9dccb;padding:6px 10px;font-size:11px}.rp-row button:disabled{opacity:.35}
.rp-box{margin:6px 23px 16px;border:2px solid #cf9530;padding:12px}.rp-box input{width:100%;background:#1d0d0f;color:#faf1f2;border:2px solid #5a2a2f;padding:10px 12px;margin:8px 0}
</style>

function parseCSV(text){const lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return[];const sep=lines[0].includes("\t")?"\t":lines[0].includes(";")?";":",";function split(line){let quoted=false,cur="",out=[];for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'&&quoted){cur+='"';i++}else if(ch==='"')quoted=!quoted;else if(ch===sep&&!quoted){out.push(cur.trim());cur=""}else cur+=ch}out.push(cur.trim());return out}let data=lines.map(split);if(/^(name|имя|игрок)$/i.test(data[0]?.[0]||""))data=data.slice(1);return data.map(([name,version,rating,position])=>({name,version,rating:Number(rating),position}))}

if(state.picks.length){const exist=new Set(cards.map(c=>c.name.trim().toLowerCase()+"\0"+c.version.trim().toLowerCase())),dup=rows.filter(r=>exist.has(r.name.trim().toLowerCase()+"\0"+r.version.trim().toLowerCase()));if(dup.length)throw Error("Во время драфта можно только добавлять новые карточки, а менять существующие нельзя. Уже есть в базе: "+dup.map(r=>r.name+" ("+r.version+")").join(", "));const seen=new Set();for(const r of rows){const k=r.name.trim().toLowerCase()+"\0"+r.version.trim().toLowerCase();if(seen.has(k))throw Error("Повтор в списке: "+r.name+" ("+r.version+")");seen.add(k)}
const names=new Set(cards.map(c=>c.name.trim().toLowerCase())),known=rows.filter(r=>names.has(r.name.trim().toLowerCase())).length;if(!confirm(`Добавить ${rows.length} карточек во время драфта? Уже выбранные пики не изменятся.${known?`\n${known} из них — новые версии футболистов, которые уже есть в базе (если футболист уже выбран, новую версию взять нельзя).`:""}`))return;
await commit(s=>{const ex=new Set([...pool,...s.extras].map(c=>c.name.trim().toLowerCase()+"\0"+c.version.trim().toLowerCase()));for(const r of rows){const k=r.name.trim().toLowerCase()+"\0"+r.version.trim().toLowerCase();if(ex.has(k))throw Error("Карточка уже добавлена: "+r.name+" ("+r.version+")");s.extras.push({id:pool.length+s.extras.length+1,name:r.name.trim(),version:r.version.trim(),rating:r.rating,position:r.position.trim().toUpperCase()});ex.add(k)}});document.getElementById("card-csv")&&(document.getElementById("card-csv").value="");warn(`Добавлено карточек: ${rows.length}. Они уже доступны в поиске, списках приоритетов и рандомайзере.`);return}
const identities=new Map(cards.map(c=>[c.name+"\0"+c.version,c]));for(const row of rows){const old=identities.get(row.name+"\0"+row.version);if(old){if(old.id<=pool.length)state.overrides[old.id]={rating:row.rating,position:row.position};else Object.assign(state.extras[old.id-pool.length-1],{rating:row.rating,position:row.position})}else{const extra={id:pool.length+state.extras.length+1,...row};state.extras.push(extra);identities.set(row.name+"\0"+row.version,extra)}}updateCards();await save();warn(`Обработано карточек: ${rows.length}`);return}
if(action==="start"){if(state.participants.length!==PEOPLE)throw Error("Сначала настройте 24 участников");if(cards.length<TOTAL)throw Error("Нужно не меньше 432 карточек");const low=cards.filter(c=>c.rating>=72&&c.rating<=74).length,mid=cards.filter(c=>c.rating>=75&&c.rating<=78).length;if(low<24||mid<52)throw Error("Для квот нужны минимум 24 карточки 72–74 и 52 карточки 75–78");await commit(s=>{if(s.status!=="live"){s.turnStartedAt=now()-(s.pausedElapsed||0);s.pausedElapsed=0}s.status="live"});render();return}
if(action==="pause"){await commit(s=>{if(s.status==="live"&&s.turnStartedAt)s.pausedElapsed=Math.max(0,now()-s.turnStartedAt);s.status="paused"});render();return}
if(action==="undo"){if(state.status==="live")throw Error("Сначала поставьте драфт на паузу");if(!state.picks.length)throw Error("Пиков ещё нет");if(!confirm("Удалить последний пик?"))return;await commit(s=>{if(s.status==="live")throw Error("Сначала поставьте драфт на паузу");if(!s.picks.length)throw Error("Пиков ещё нет");s.picks.pop();s.pausedElapsed=0});render();return}
if(action==="reset"){if(!confirm("Удалить все пики и списки приоритетов и начать новый драфт? Скачайте журнал заранее. Участники, их коды и карточки сохранятся."))return;await commit(s=>{s.status="paused";s.picks=[];s.wishlists={};s.turnStartedAt=0;s.pausedElapsed=0});warn("Пики очищены. Можно заменить участников и запустить новый драфт.");return}
if(action==="export-picks"){const lines=["№;Участник;Игрок;Версия;Рейтинг;Позиция;Время",...state.picks.map(p=>{const d=pickDetails(p);return[p.number,d.participantName,d.name,d.version,d.rating,d.position,p.at].map(csvCell).join(";")})];download("piala-picks.csv","\uFEFF"+lines.join("\n"),"text/csv;charset=utf-8");return}
if(action==="export-state"){download("piala-draft-backup.json",JSON.stringify(state,null,2),"application/json");return}
}catch(error){warn(error.message||"Ошибка")}}
async function submit(event){const form=event.target.closest("form[data-form]");if(!form)return;event.preventDefault();const value=form.elements.code.value.trim().toUpperCase();try{if(!ready)throw Error("Подключаемся к базе… подождите пару секунд и повторите");const hash=await sha(value);if(form.dataset.form==="admin-login"){if(hash!==ADMIN_HASH)throw Error("Неверный код организатора");session={role:"admin",id:0,hash};tab="admin";saveSession(hash)}else if(hash===ADMIN_HASH){session={role:"admin",id:0,hash};tab="admin";saveSession(hash)}else{const p=state.participants.find(p=>p.codeHash===hash);if(!p)throw Error("Код не найден");session={role:"participant",id:p.id,hash};tab="live";saveSession(hash)}notice="";render()}catch(error){warn(error.message||"Ошибка входа")}}
async function restore(file){if(session.role!=="admin")return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.participants)||!Array.isArray(data.picks)||!Array.isArray(data.extras)||data.picks.length>TOTAL||data.participants.length>PEOPLE)throw Error("Неверный формат копии");if(!confirm("Заменить текущие данные содержимым резервной копии?"))return;state={...defaultState(),...data};issuedCodes=[];updateCards();await save();warn("Резервная копия восстановлена") }catch(error){warn(error.message||"Не удалось восстановить копию")}}
root.addEventListener("click",click);root.addEventListener("submit",submit);root.addEventListener("input",event=>{if(event.target.id==="card-search"){query=event.target.value;results()}if(event.target.id==="rp-search"){rpQuery=event.target.value;rpResults()}});root.addEventListener("change",event=>{if(event.target.id==="restore-file"&&event.target.files?.[0])restore(event.target.files[0]);if(event.target.id==="rating-min"){minRating=event.target.value;if(maxRating&&Number(minRating)>Number(maxRating)){maxRating="";document.getElementById("rating-max").value=""}results()}if(event.target.id==="rating-max"){maxRating=event.target.value;if(minRating&&Number(maxRating)<Number(minRating)){minRating="";document.getElementById("rating-min").value=""}results()}if(event.target.id==="position-filter"){positionFilter=event.target.value;results()}if(event.target.id==="rp-who"){rpPid=Number(event.target.value);rpNum=0;rpQuery="";event.target.blur();render()}if(event.target.id==="rnd-who"){rndPid=Number(event.target.value);rndResult=null;event.target.blur();render()}if(event.target.id==="rnd-range"){rndRange=event.target.value;rndResult=null;event.target.blur();render()}if(event.target.id==="rnd-pos"){rndPos=event.target.value;rndResult=null;event.target.blur();render()}});root.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender&&!isTyping())refresh()},700)});
(async()=>{try{const text=document.getElementById("card-pool").textContent.trim(),bytes=Uint8Array.from(atob(text),ch=>ch.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")),rows=JSON.parse(await new Response(stream).text());pool=rows.map(([name,version,rating,position],i)=>({id:i+1,name,version,rating,position}));state=defaultState();updateCards();render();startSync()}catch(error){root.innerHTML=`<main class="site"><div class="empty">Не удалось загрузить автономный пул карточек: ${esc(error.message)}. Откройте файл в современном браузере.</div></main>`}})();
})();
